services:
  - type: web
    name: rutavida-api
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: RUTAVIDA_DB_URL
        sync: false
      - key: RUTAVIDA_DB_USER
        sync: false
      - key: RUTAVIDA_DB_PASSWORD
        sync: false
      - key: RUTAVIDA_CORS_ORIGINS
        sync: false
