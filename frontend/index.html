<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'">
  <meta name="theme-color" content="#0b1220">
  <title>RutaVida - Iniciar sesión</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/rutavida.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand">
        <img src="img/logo.svg" alt="">
        <span>RutaVida</span>
      </div>

      <h1 id="login-title">Iniciar sesión</h1>
      <p class="subtitle">Centro de coordinación de emergencias de Valledupar</p>

      <p id="login-message" class="message" role="alert" aria-live="polite" hidden></p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text"
                 autocomplete="username" maxlength="40" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-row">
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>
            <button id="toggle-password" class="button button-secondary"
                    type="button" aria-controls="password" aria-pressed="false">
              Mostrar
            </button>
          </div>
        </div>

        <button class="button" type="submit">Ingresar</button>
      </form>

      <p class="muted">
        Maqueta académica. El inicio de sesión todavía no está conectado al sistema.
      </p>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
